name: ssh_client
description: A personal Flutter SSH terminal for Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  prism_ui:
    git:
      url: https://github.com/chen08209/prism_ui.git
      ref: 5d8ed7ab674ed2011adf94a7e41aff6d705e9cb6
  dartssh2: ^4.1.0
  xterm2: ^5.3.0
  fluid_glass: ^0.5.6
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.3
  crypto: ^3.0.6
  path_provider: ^2.1.5
  # v21：地理数据改成远端下载更新（GitHub Releases），首次启动后台下载、
  # 之后每天查一次 manifest；IpGeoDatabase 不再读包内数据文件。
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # v9：测试里 FakePlatformFile 的 xFile 要用到 XFile（file_picker 的传递依赖，
  # 只在测试里直接引用，所以声明为 dev 依赖）。
  cross_file: ^0.3.5+5
flutter:
  uses-material-design: true
  assets:
    - assets/geo/land_110m.bin
    # v21：ip4/ip6 城市库（26.5MB）不再打进包里，改成远端下载
    # （GitHub Releases，manifest 比对版本、SHA-256 校验）；
    # manifest.json 留着当种子（首次启动没有本地 manifest 时用它）。
    - assets/geo/manifest.json
